name: Bug report
description: A skill, authored finding, artifact, diagram or integration problem.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Report security defects privately through the Security tab.
        Share only sanitized artifacts and source excerpts. Unknown model
        details are fine; do not guess them.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Interpretation or model-authored finding
        - Skill installation or discovery
        - Artifact validation or publication
        - Diagram, refinement or source navigation
        - Packaging or development checks
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Environment
      description: MLView revision, assistant host/version, exposed model name, VS Code and OS. Python version for helper failures.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Request, entrypoint/configuration and minimal safe source or artifact excerpt. Include evidence that supports or contradicts a disputed interpretation.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant sanitized output
      description: Include validation errors or screenshots if useful; remove secrets, private paths and unrelated source.
