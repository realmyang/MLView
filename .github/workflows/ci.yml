name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  python:
    name: Python tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest skills/mlview/tests tools scripts -q
      - run: python scripts/check_docs.py
  integration:
    name: Build, test and package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows gets 45 minutes; the other runners keep 15.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 20.18.1 is engines.node and enforces "no API newer than Node 20".
          - os: ubuntu-latest
            node: '20.18.1'
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: ubuntu-latest
            node: '26'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            webview/package-lock.json
            vscode-extension/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - name: End-to-end gate (sh driver, 17 gates)
        if: runner.os != 'Windows'
        run: sh scripts/e2e.sh
      - name: End-to-end gate (PowerShell driver, 17 gates)
        if: runner.os == 'Windows'
        run: pwsh -File scripts/e2e.ps1
      - name: Built viewer is committed and synchronized
        run: git diff --exit-code -- webview/dist vscode-extension/media vscode-extension/THIRD_PARTY_NOTICES.md vscode-extension/CHANGELOG.md claude-plugin/skills/mlview
      - name: Produce distributable packages
        run: |
          python tools/package_skill.py --host shared
          python tools/package_skill.py --host claude-code
          npm --prefix vscode-extension run package
      - run: python scripts/vsix_check.py
      - uses: actions/upload-artifact@v5
        with:
          name: mlview-packages-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            vscode-extension/*.vsix
            .mlview/dist/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  claude-plugin:
    # This job uses no credentials and no secrets.
    name: Claude plugin validate --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm install -g @anthropic-ai/claude-code@2.1.274
      - name: Plugin and marketplace validate strictly (a missing CLI fails)
        run: python -m pytest tools/test_claude_plugin.py -q
        env:
          MLVIEW_REQUIRE_CLAUDE_CLI: '1'
