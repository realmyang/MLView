name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  python:
    name: Native helper (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest skills/mlview/tests tools evals scripts claude-plugin/tests -q
      - run: python scripts/check_docs.py
  integration:
    name: Native packages (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.18.1'
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '22'
          - os: macos-latest
            node: '22'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            webview/package-lock.json
            vscode-extension/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check.py e2e
      - name: Built viewer is committed and synchronized
        run: git diff --exit-code -- webview/dist vscode-extension/media vscode-extension/THIRD_PARTY_NOTICES.md claude-plugin/skills/mlview
      - name: Produce distributable packages
        run: |
          python tools/package_skill.py --host shared
          python tools/package_skill.py --host claude-code
          npm --prefix vscode-extension run package
      - run: python scripts/vsix_check.py
      - uses: actions/upload-artifact@v5
        with:
          name: mlview-packages-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            vscode-extension/*.vsix
            .mlview/dist/*.zip
          include-hidden-files: true
          if-no-files-found: error
