name: nightly

# HEALTH-02 / CONTRACTS 11.30. `tools/verify.py --scopes --fuzz 200` is the desk
# gate — 200 generated (graph, selector) pairs in about three seconds. This is
# the same gate at 2000, which reaches shapes 200 does not: five hundred-node
# documents, three-way disconnected components, ghost densities of a half. It is
# the only thing here, it is ubuntu-only (1x), and it runs once a day rather than
# on every push, because a fuzzer that costs a push is a fuzzer people delete.
#
# A schedule only fires on the DEFAULT branch, so this file does nothing until it
# is on `main`; `workflow_dispatch` is how it is exercised before then, and how a
# seed from a failed run is replayed by hand.

on:
  schedule:
    # 04:17 UTC. Not on the hour: GitHub queues cron runs and the top of an hour
    # is the busiest slot on the free schedulers.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: 'how many (graph, selector) pairs to check'
        required: false
        default: '2000'
      seed:
        description: 'replay a specific seed (0 = clock-derived, printed in the log)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  CI: 'true'

jobs:
  scope-fuzz:
    name: scope fuzz (${{ github.event.inputs.cases || 2000 }} cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: analyzer/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: webview/package-lock.json
      - name: install the analyzer and the validator's dependency
        run: python -m pip install --upgrade pip && python -m pip install -e analyzer jsonschema
      - name: build the viewer bundle the fuzzer projects through
        # The harness loads `webview/dist/mlview.js` — the file the VS Code
        # webview and the standalone report actually load — so it must be built
        # from THIS commit's source, not from whatever is checked in.
        run: npm ci && npm run build
        working-directory: webview
      - name: python project() == typescript project(), on generated graphs
        # `--fuzz N` is the only flag this adds to `verify.py`; a seed travels in
        # the environment so the gate table keeps exactly one new option.
        env:
          MLVIEW_FUZZ_SEED: ${{ github.event.inputs.seed || 0 }}
        run: python tools/verify.py --scopes --fuzz ${{ github.event.inputs.cases || 2000 }}
