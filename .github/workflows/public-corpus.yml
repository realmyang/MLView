name: Public corpus

# PUB-01. The labelled corpus (`tools/accuracy.py`) measures MLView against
# 158 programs written for it. This job measures it against code nobody
# wrote for it: thirty-seven pinned public ML/DL repositories, analysed three
# ways each (default, `--dataflow ip`, and `--include-notebooks` where the
# repository ships notebooks).
#
# It asserts the four things that can never be a judgement call - no crash, no
# exit code outside {0, 4}, every document schema-valid, every run inside the
# wall-time budget - and one that is: no high-severity finding that a human has
# not already read and recorded in `analyzer/tests/public_corpus/adjudication.json`.
# A false positive already recorded there as `state: open` is listed, not fatal;
# one recorded as `state: fixed` coming back fails the job, which is what makes
# that file a ratchet rather than a diary.
#
# COST. ~1.9 GB of shallow clones and ~1 minute of analysis, so it is
# **schedule + manual only**: it never runs on a push or a pull request. Every
# clone is pinned to a SHA, so a run is reproducible and an upstream force-push
# cannot silently change what is being measured.

on:
  schedule:
    # 04:20 UTC on Mondays. Weekly, not nightly: the corpus is pinned, so the
    # only thing that changes between runs is MLView itself.
    - cron: '20 4 * * 1'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repo names from repos.json (empty = all)'
        required: false
        default: ''
      strict:
        description: 'Also fail on known-open false positives'
        type: boolean
        required: false
        default: false

concurrency:
  group: public-corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  MLVIEW_PUBLIC_CORPUS_DIR: ${{ github.workspace }}/.public-corpus

permissions:
  contents: read

jobs:
  corpus:
    name: analyze 37 public repositories
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analyzer/pyproject.toml

      - name: install the analyzer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "analyzer[dev]"

      - name: manifest and gate logic (no corpus needed)
        run: python -m pytest analyzer/tests/public_corpus -q

      # Shallow, blob-filtered, sparse where the repository is large. Pinned to
      # a SHA, so the fetch is either exactly what repos.json recorded or an
      # error - never a moving target.
      #
      # PUB2-10, two halves of one defect. This step used to generate
      # `public_corpus.py fetch --repo <names>`, and `--repo` lived only on the
      # top-level parser, so argparse answered `unrecognized arguments` and
      # exited 2: every dispatch that used the documented `repos` input failed
      # at the job's first step. The step below used to pass no selector at
      # all, so even a fixed fetch would have cloned one repository, planned all
      # thirty-seven, and failed the gate on `target directory missing` for the
      # other thirty-six. `tools/public_corpus.py` now takes the selector on
      # either side of the subcommand, both steps pass it, and doc-gate check 19
      # (`scripts/doc_numbers.py`) parses these lines with that CLI's own parser
      # so the next edit to either one cannot go un-run until the nightly.
      #
      # The input reaches the shell through `env:` and is quoted, never pasted
      # into the script by `${{ }}`: a `workflow_dispatch` input is text a human
      # typed, and interpolating it into `run:` would execute whatever it says.
      - name: fetch the pinned corpus
        env:
          REPOS: ${{ github.event.inputs.repos }}
        run: |
          python tools/public_corpus.py ${REPOS:+--repo "$REPOS"} fetch
          du -sh "$MLVIEW_PUBLIC_CORPUS_DIR"

      # PUB-BUDGET-01. `--budget` is the per-run wall-time ceiling the gate
      # asserts, and 120 is the RUNNER's number, not the tool's: the default in
      # `tools/public_corpus.py` stays 60, which is what a development machine
      # sees. The first run of this job after Actions billing was restored
      # (34974208055, the dispatch on `public`) failed the gate on exactly one
      # target - `pytorch-image-models .` in `ip` mode at **62.5 s** against a
      # 60 s ceiling, with `local` on the same target at 50.1 s and the next
      # slowest run in the whole corpus at 21.2 s. timm is the largest thing in
      # the manifest and `ip` became the default in the recall campaign, so that
      # pair is simply the most expensive analysis there is, measured for the
      # first time on a 4-vCPU hosted runner rather than on the Apple-silicon
      # laptop the 60 was calibrated on. Failing a build on 4 % over a number
      # that describes somebody else's CPU is a flake, not a gate; 120 still
      # leaves the assertion doing its job, because what it exists to catch is a
      # run that has gone quadratic or stopped making progress, and that is an
      # order of magnitude, not 4 %.
      - name: analyze every target (default, --dataflow ip, --include-notebooks)
        env:
          REPOS: ${{ github.event.inputs.repos }}
        run: |
          python tools/public_corpus.py ${REPOS:+--repo "$REPOS"} run \
            --out "$MLVIEW_PUBLIC_CORPUS_DIR/_reports/report.json" \
            --graphs "$MLVIEW_PUBLIC_CORPUS_DIR/_reports/graphs" \
            --jobs 4 --budget 120

      - name: gate
        run: |
          python tools/public_corpus.py check \
            --report "$MLVIEW_PUBLIC_CORPUS_DIR/_reports/report.json" \
            ${{ github.event.inputs.strict == 'true' && '--strict' || '' }}

      # The report is the evidence behind the verdict: every run's exit code,
      # wall time, node/edge/issue counts, diagnostics and findings. Uploaded
      # whether the gate passed or failed, because a failure is exactly when
      # somebody needs to read it. The graph documents are not uploaded - they
      # are hundreds of megabytes and derivable from the pinned SHAs.
      - name: upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-corpus-report
          path: ${{ env.MLVIEW_PUBLIC_CORPUS_DIR }}/_reports/report.json
          # CI-ARTIFACTS-01, again. MLVIEW_PUBLIC_CORPUS_DIR expands to
          # `<workspace>/.public-corpus`, a dot-directory, and upload-artifact
          # skips hidden paths unless this is set: without it the glob matched
          # nothing, `if-no-files-found: warn` kept the step green, and every
          # run of this job would have archived no report at all -- the evidence
          # behind the verdict, missing exactly when somebody needs to read it.
          # The env reference is why doc-gate check 10 could not see it; it
          # resolves `${{ env.* }}` now.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
