# The repo root is installable, because `.pre-commit-hooks.yaml` needs it to be.
#
# HOST-2. A `language: python` pre-commit hook is installed by cloning THIS
# repository, creating a venv and running `pip install .` **in the clone root** —
# pre-commit has no way to be pointed at a subdirectory. With the only packaging
# metadata living in `analyzer/pyproject.toml`, that install failed with
# "Directory '.' is not installable" and neither `mlview` nor `mlview-changed`
# could ever run, tag or no tag. So the root is a second, thin distribution of the
# SAME package: no new source, no second copy of the analyzer, just the metadata
# `pip install .` needs to find `analyzer/src/mlview`.
#
# Two invariants keep this file from becoming a place where truth can drift, and
# `claude-plugin/tests/test_pre_commit_hooks.py` asserts both:
#
#   * the version is `dynamic`, read from `mlview.version.__version__` — the one
#     string `tools/verify.py --versions` already gates. A literal here would be a
#     sixth manifest to keep in step, and the gate does not read this file.
#   * `[project.scripts]`, `requires-python`, `dependencies` and the package-data
#     globs mirror `analyzer/pyproject.toml` exactly; a wheel built from this file
#     that omitted `schema/*.json` would install perfectly and fail on the first
#     analysis, which is the failure `tools/wheel_check.py` exists to catch.
#
# `python -m build --wheel analyzer` (scripts/build.sh step 6) still builds the
# distribution that gets published — this file is for consumers who install the
# repository itself: the pre-commit hook, `pip install git+https://…/MLView`, and
# `pip install -e .` from a checkout.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlview"
dynamic = ["version"]
description = "Static analysis of Python ML pipelines into an interactive, issue-annotated workflow graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MLView" }]
keywords = ["machine-learning", "pytorch", "scikit-learn", "static-analysis", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
mlview = "mlview.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mlview.version.__version__" }

[tool.setuptools]
package-dir = { "" = "analyzer/src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["analyzer/src"]
include = ["mlview*"]

[tool.setuptools.package-data]
mlview = ["schema/*.json", "emit/assets/*"]
