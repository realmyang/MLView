# CI-ADOPT — MLView as a pre-commit hook.
#
#   repos:
#     - repo: https://github.com/realmyang/MLView
#       rev: v0.1.0
#       hooks:
#         - id: mlview
#
# `pass_filenames: false` is the load-bearing line, and it is not an optimisation.
# pre-commit's default is to hand each hook the staged files, and running MLView
# per file is exactly the fidelity bug COVERAGE measured: four cross-file rules
# (MLV301, MLV302, MLV401, MLV501) cannot fire without a sibling module, and a
# single file yields 3 findings where its directory yields 7. A hook that quietly
# loses half the rules is worse than no hook, so MLView analyses the whole project
# and attributes afterwards.
#
# `always_run: true` follows from the same fact: a change to `train.py` can create a
# leak whose evidence is in `data.py`, so the hook must run even when nothing it
# would have been handed matches.
#
# HOST-2: `language: python` makes pre-commit clone this repository, build a venv and
# run `pip install .` in the CLONE ROOT — it cannot be pointed at `analyzer/`. The
# root `pyproject.toml` exists for exactly that install and packages
# `analyzer/src/mlview` in place; delete it and both hooks die with "Directory '.' is
# not installable", tag or no tag. `claude-plugin/tests/test_pre_commit_hooks.py` is
# the gate, `pre-commit try-repo` and all.

- id: mlview
  name: MLView (ML pipeline analysis)
  description: >-
    Analyze the whole project's ML pipeline and report leakage, training-loop and
    reproducibility defects. Fully local static analysis; your code is never executed
    and never leaves the machine.
  entry: mlview
  args: ['analyze', '.', '--format', 'summary', '--fail-on', 'high']
  language: python
  types: [python]
  pass_filenames: false
  always_run: true
  require_serial: true

# The adoption variant: fail only on what THIS commit changed. Point it at whatever
# your default branch is; findings that predate the change are reported by
# `mlview analyze .` and never block the commit.
#
#         - id: mlview-changed
#           args: ['analyze', '.', '--changed-since', 'origin/main', '--changed-only',
#                  '--format', 'summary', '--fail-on', 'high']
- id: mlview-changed
  name: MLView (only what this change touched)
  description: >-
    The same whole-project analysis, reporting only the findings that touch what
    changed since HEAD. The gate a repository that already has findings can adopt on
    day one. Override `args` to attribute against your default branch instead.
  entry: mlview
  args: ['analyze', '.', '--changed-since', 'HEAD', '--changed-only', '--format',
         'summary', '--fail-on', 'high']
  language: python
  types: [python]
  pass_filenames: false
  always_run: true
  require_serial: true
