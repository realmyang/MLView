            var resolved = theme;
            if (theme === 'auto') {
              resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            app.setTheme(resolved);
          });
          bar.appendChild(b);
        });

        // Deep-link demo (CONTRACTS 11.17). Top-level file:// -> the hidden
        // iframe hands the URL to the OS and VS Code opens; inside ?embed=1 the
        // same click copies `file:line` and offers an "Open in VS Code" link in
        // the toast. Neither one is ever allowed to navigate this document.
        var deep = document.createElement('button');
        deep.type = 'button';
        deep.textContent = 'deep link';
        deep.title = 'Post openLocation through the standalone bridge (CONTRACTS 11.17)';
        deep.addEventListener('click', function () {
          var node = graph.nodes.filter(function (n) {
            return !n.ghost;
          })[0];
          bridge.post({
            v: 1,
            type: 'openLocation',
            file: node.loc.file,
            absFile: node.loc.absFile,
            line: node.loc.line,
            col: node.loc.col,
            endLine: node.loc.endLine,
            endCol: node.loc.endCol,
          });
        });
        bar.appendChild(deep);

        var embed = document.createElement('a');
        embed.href = './index.html?embed=1';
        embed.textContent = 'sandboxed →';
        embed.title = 'The same report inside a sandboxed iframe: Go to copies instead of launching';
        embed.style.alignSelf = 'center';
        embed.style.color = 'var(--mlv-link, #2b57c4)';
        bar.appendChild(embed);

        // VIEW-08. The overlay is already on the page as `#mlview-diff`, so the
        // viewer mounted with it. This toggle exercises the OTHER route — the
        // `diffOverlay` host message — by posting it at the window the
        // standalone bridge listens on, which is the same path VS Code uses.
        var overlayEl = document.getElementById('mlview-diff');
        var overlay = overlayEl ? JSON.parse(overlayEl.textContent) : null;
        var diffOn = !!overlay;
        var diffBtn = document.createElement('button');
        diffBtn.type = 'button';
        diffBtn.id = 'dev-diff';
        diffBtn.textContent = 'diff';
        diffBtn.title = 'Send or clear the diff overlay through the diffOverlay host message (VIEW-08)';
        diffBtn.setAttribute('aria-pressed', diffOn ? 'true' : 'false');
        diffBtn.addEventListener('click', function () {
          diffOn = !diffOn;
          diffBtn.setAttribute('aria-pressed', diffOn ? 'true' : 'false');
          window.postMessage({ v: 1, type: 'diffOverlay', overlay: diffOn ? overlay : null }, '*');
        });
        bar.appendChild(diffBtn);

        var states = document.createElement('a');
        states.href = './states.html';
        states.textContent = 'states →';
        states.style.alignSelf = 'center';
        states.style.color = 'var(--mlv-link, #2b57c4)';
        bar.appendChild(states);
      })();
    </script>
  </body>
</html>
