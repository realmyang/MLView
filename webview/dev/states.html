<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MLView — node kinds × states</title>
    <link rel="stylesheet" href="../dist/mlview.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--mlv-bg, #fbfbfd);
        color: var(--mlv-text, #16181d);
        font-family: var(--mlv-font, ui-sans-serif, system-ui, sans-serif);
      }
      .page {
        padding: 20px 24px 64px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      p.lede {
        margin: 0 0 20px;
        color: var(--mlv-text-2, #5a6070);
        font-size: 12px;
        max-width: 70ch;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--mlv-text-3, #676e81);
        margin: 28px 0 10px;
      }
      .grid {
        display: grid;
        gap: 14px 16px;
        align-items: start;
      }
      .colhead,
      .rowhead {
        font-size: 11px;
        color: var(--mlv-text-3, #676e81);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        align-self: center;
      }
      .cell {
        position: relative;
        min-height: 76px;
      }
      .swatches {
        display: flex;
        gap: 28px;
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .swatch {
        text-align: center;
        font-size: 11px;
        color: var(--mlv-text-2, #5a6070);
      }
      .swatch > svg {
        display: block;
        margin: 0 auto 6px;
      }
      .bar {
        position: fixed;
        right: 12px;
        top: 8px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .bar button {
        padding: 2px 8px;
        border: 1px solid var(--mlv-border, #e3e5eb);
        border-radius: 6px;
        background: var(--mlv-surface, #fff);
        color: inherit;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }
      .bar button[aria-pressed='true'] {
        border-color: var(--mlv-accent, #3b6cf6);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="bar" id="theme-bar"></div>
    <div class="page" id="page">
      <h1>MLView — node kinds × states</h1>
      <p class="lede">
        The visual reference for the renderer. Every node kind in every state, plus the three severity markers.
        Built from the same code the app uses (<code>MLView.__internal.buildDemoCard</code>), so this page cannot
        drift from the product.
      </p>
      <div id="mount"></div>
    </div>

    <script src="../dist/mlview.js"></script>
    <script>
      (function () {
        var STATES = ['default', 'hover', 'selected', 'dimmed', 'ghost', 'stale'];
        var page = document.getElementById('mount');
        var internal = MLView.__internal;

        function h(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text !== undefined) node.textContent = text;
          return node;
        }

        function section(title) {
          page.appendChild(h('h2', null, title));
        }

        // ── markers ──────────────────────────────────────────────────────
        section('Severity markers — three shapes, never colour alone');
        var swatches = h('div', 'swatches');
        [
          ['low', 'circled i · a note'],
          ['medium', 'warning triangle · !'],
          ['high', 'exclamation octagon · !'],
        ].forEach(function (pair) {
          [28, 18, 14, 12].forEach(function (size) {
            var box = h('div', 'swatch');
            box.appendChild(internal.severityGlyph(pair[0], size, pair[0] + ' severity'));
            box.appendChild(h('div', null, size === 28 ? pair[1] : size + 'px'));
            swatches.appendChild(box);
          });
        });
        page.appendChild(swatches);

        // ── kinds x states ───────────────────────────────────────────────
        section('Node kinds × states');
        var grid = h('div', 'grid');
        grid.style.gridTemplateColumns = '110px repeat(' + STATES.length + ', 232px)';
        grid.appendChild(h('div', 'colhead', ''));
        STATES.forEach(function (state) {
          grid.appendChild(h('div', 'colhead', state));
        });

        var STAGE_BY_KIND = {
          entrypoint: 'config',
          config: 'config',
          dataset: 'data',
          dataloader: 'data',
          split: 'preprocess',
          transform: 'preprocess',
          augment: 'preprocess',
          model: 'model',
          layer: 'model',
          loss: 'objective',
          optimizer: 'objective',
          scheduler: 'objective',
          scaler: 'preprocess',
          train_loop: 'train',
          eval_loop: 'eval',
          metric: 'eval',
          checkpoint: 'deliver',
          tracker: 'deliver',
          predict: 'deliver',
          function: 'train',
          class: 'model',
          artifact: 'deliver',
          external: 'config',
          unknown: 'config',
        };
        var SEVERITY_BY_INDEX = [null, 'low', 'medium', 'high'];

        internal.nodeKinds.forEach(function (kind, i) {
          grid.appendChild(h('div', 'rowhead', kind));
          STATES.forEach(function (state, j) {
            var cell = h('div', 'cell');
            cell.appendChild(
              internal.buildDemoCard({
                kind: kind,
                stage: STAGE_BY_KIND[kind] || 'model',
                state: state,
                severity: state === 'ghost' ? 'high' : SEVERITY_BY_INDEX[(i + j) % 4],
                label: kind,
              })
            );
            grid.appendChild(cell);
          });
        });
        page.appendChild(grid);

        // ── theme switch ────────────────────────────────────────────────
        var bar = document.getElementById('theme-bar');
        ['light', 'dark', 'hc'].forEach(function (theme, i) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = theme;
          b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
          b.addEventListener('click', function () {
            Array.prototype.forEach.call(bar.children, function (other) {
              other.setAttribute('aria-pressed', 'false');
            });
            b.setAttribute('aria-pressed', 'true');
            document.documentElement.setAttribute('data-theme', theme);
          });
          bar.appendChild(b);
        });
        var initial =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', initial);
        Array.prototype.forEach.call(bar.children, function (b) {
          b.setAttribute('aria-pressed', b.textContent === initial ? 'true' : 'false');
        });
      })();
    </script>
  </body>
</html>
