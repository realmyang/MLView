# CFG-ONE (CONTRACTS 11.37): every table the configuration surface understands,
# in one file, so a test can assert the whole surface rather than one key.
[paths]
exclude = ["experiments/**"]
include = ["src/**"]
notebooks = true

[analysis]
relevance = "all"
relevance_hops = 3
dataflow = "ip"
max_nodes = 77
include_notebooks = true

[baseline]
path = "ci/baseline.json"

[rules]
disable = ["MLV601"]
min_confidence = 0.42

[rules.severity]
MLV201 = "low"
