# Every mistake a configuration file can make, in one place. Not one of them
# may stop the analysis: a bad config that refuses to analyze is worse than a
# bad config that says what it ignored.
[paths]
exclude = "experiments/**"
notebooks = "yes"
excludes = ["typo"]

[analysis]
relevance = "sometimes"
max_nodes = -3
dataflows = "ip"

[baseline]
paths = "ci/baseline.json"

[rules]
disable = ["MVL601"]
min_confidence = 7
MLV999 = "off"
MLV202 = "high"

[nonsense]
key = 1
