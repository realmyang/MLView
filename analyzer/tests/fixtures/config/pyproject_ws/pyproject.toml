# CFG-ONE: the same tables MLView reads from `.mlview.toml`, read from
# `[tool.mlview]` when a project would rather keep one file.
[project]
name = "example-ml-project"
version = "0.0.0"

[tool.mlview.rules]
disable = ["MLV601"]

[tool.mlview.paths]
exclude = ["scratch/**"]

[tool.mlview.analysis]
max_nodes = 55
