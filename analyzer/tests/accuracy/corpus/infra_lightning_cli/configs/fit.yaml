# jsonargparse config consumed by `python cli.py fit --config configs/fit.yaml`
seed_everything: 1234

trainer:
  max_epochs: 30
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  gradient_clip_val: 1.0
  deterministic: true
  log_every_n_steps: 25
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: runs
      name: conversion

model:
  class_path: module.ConversionClassifier
  init_args:
    in_features: 5
    width: 128
    classes: 2
    lr: 0.003
    weight_decay: 0.01
    max_lr: 0.01
    total_steps: 4000

data:
  class_path: datamodule.ConversionDataModule
  init_args:
    csv_path: data/conversions.csv
    batch_size: 256
    num_workers: 4
    val_fraction: 0.2
    seed: 7
