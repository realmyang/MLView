[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpkg"
version = "0.3.1"
description = "Tabular ticket router, driven entirely by a click console script"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "numpy>=1.26", "torch>=2.2"]

[project.scripts]
mlpkg = "mlpkg.cli:cli"

[tool.setuptools.packages.find]
include = ["mlpkg*"]
