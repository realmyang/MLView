base:
  seed: 2718
  raw_path: data/raw/energy.csv
  interim_path: data/interim/energy.parquet
  model_path: models/energy.joblib
  metrics_path: metrics/energy.json

prepare:
  date_column: reading_ts
  target_column: demand_mw
  resample: 1h
  lags: [1, 2, 3, 24, 168]
  rolling_windows: [3, 24]

split:
  test_size: 0.2
  shuffle: true

train:
  estimator: hist_gradient_boosting
  max_iter: 400
  learning_rate: 0.05
  max_leaf_nodes: 63
  l2_regularization: 0.1

evaluate:
  metrics: [mae, rmse, mape]
