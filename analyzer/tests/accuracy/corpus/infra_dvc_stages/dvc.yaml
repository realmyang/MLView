stages:
  prepare:
    cmd: python -m src.stages.prepare
    deps:
      - src/stages/prepare.py
      - data/raw/energy.csv
    params:
      - base.seed
      - base.raw_path
      - prepare
    outs:
      - data/interim/energy.parquet

  train:
    cmd: python -m src.stages.train
    deps:
      - src/stages/train.py
      - data/interim/energy.parquet
    params:
      - base.seed
      - split
      - train
    outs:
      - models/energy.joblib
      - data/interim/holdout.parquet

  evaluate:
    cmd: python -m src.stages.evaluate
    deps:
      - src/stages/evaluate.py
      - models/energy.joblib
      - data/interim/holdout.parquet
    params:
      - evaluate
    metrics:
      - metrics/energy.json:
          cache: false
