[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlview"
version = "0.1.0"
description = "Static analysis of Python ML pipelines into an interactive, issue-annotated workflow graph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MLView" }]
keywords = ["machine-learning", "pytorch", "scikit-learn", "static-analysis", "visualization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
mlview = "mlview.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
# REV-06. `license = { text = "MIT" }` puts one word in METADATA and no licence
# text anywhere; the built wheel's `dist-info` carried no licence file at all,
# so `pip install mlview` installed an MIT package with nothing on disk saying
# so - which is exactly the path docs/VALIDATION.md Part 4 walks a validator
# down. `analyzer/LICENSE` is byte-identical to the root one and to
# `vscode-extension/LICENSE`; naming it here is explicit rather than relying on
# setuptools' default glob, so a rename cannot silently drop it again.
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlview*"]

[tool.setuptools.package-data]
mlview = ["schema/*.json", "emit/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
